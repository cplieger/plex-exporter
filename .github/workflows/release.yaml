# Synced from cplieger/ci/.github/workflow-templates/release.yml — DO NOT EDIT.
# The release pipeline is fully centralized in
# cplieger/ci/.github/workflows/release.yaml; this file only calls it. The
# central pipeline selects the channel from the branch it runs on (main is the
# stable channel), computes the version, detects the repo type and the changed
# paths, and publishes; a push to dev publishes the dev channel. Per-repo
# behaviour is the "Resolve repo policy" step there; no override surface here.
name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      # Read by the v2 pipeline's no-change gate through github.event.inputs
      # (deliberately not forwarded via `with:`); the scheduled staleness
      # rebuild dispatches with it while a repo's default branch is main.
      skip_if_unchanged:
        description: "Skip publishing when the rebuilt image is package-identical to :latest (used by the scheduled staleness rebuild)."
        type: boolean
        default: false
      # Read by the two-branch pipeline through github.event.inputs, never
      # `with:`, which a v2 pin does not declare. A stable run's dev barrier
      # dispatches `renumber` on dev; a person never needs to.
      mode:
        description: "'renumber' re-tags dev's newest builds under fresh pre-release versions; 'normal' otherwise."
        type: choice
        options: [normal, renumber]
        default: normal

# Serialize release runs per repo. Two merges seconds apart otherwise race:
# the losing run can 403 even on the git-refs tag create and strand a
# releasable commit behind a root_changed=false skip (observed on
# web-terminal-server, 2026-07-19). Queued, never cancelled — when GitHub
# replaces a superseded queued run with a newer one, the newer run's cliff
# window covers the superseded run's commits, so nothing is lost. Lives here
# and not in the reusable workflow: workflow-level concurrency only takes
# effect in the workflow GitHub actually schedules (the caller); the called
# workflow supports it at job level only.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Top-level permissions are read-only (least privilege); the release job declares
# the write scopes it actually needs. GitHub takes the intersection of these
# job-level grants and what the called reusable workflow declares, so scoping
# them to the job is functionally equivalent.
permissions:
  contents: read

jobs:
  release:
    permissions:
      # The two-branch dev barrier dispatches dev release runs.
      actions: write
      contents: write
      statuses: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: cplieger/ci/.github/workflows/release.yaml@05618429989dbe5dbf573b12db5ff7aeb2ffd87b # v3
    # Forward only the two Docker Hub publish credentials the reusable pipeline
    # actually declares and consumes, rather than `secrets: inherit` (which
    # exposes every repo secret to the reusable-workflow trust boundary). Both
    # are `required: false` upstream, so repos without them (Go/TS libs that
    # publish via OIDC) pass empty values and skip the Docker Hub job entirely.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
