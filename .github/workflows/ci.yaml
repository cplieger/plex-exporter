# Synced from cplieger/ci/.github/workflow-templates/ci.yml — DO NOT EDIT.
# No paths-ignore: a workflow skipped by a path filter leaves the required
# ci / validate pending forever, so the meta ci.yaml gates its heavy jobs on a
# real code change instead.
name: CI

# Both branches stay listed: a repo that has not adopted a dev branch keeps
# its checks on main, and one that has gets them on dev.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref for PR events only: rapid pushes to a
# PR branch otherwise stack full CI batteries that compete for the account's
# 20 concurrent-job budget. Pushes to main queue instead of cancelling, so
# every main commit keeps a complete validation run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The dead-code check uploads its findings to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: cplieger/ci/.github/workflows/ci.yaml@772998147f61cafb3223ce4e2650b79680bbdeef # v3
