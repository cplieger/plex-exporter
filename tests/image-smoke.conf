# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the distroless
# `plex-exporter health` probe of GET /healthz) to report "healthy", then
# scrapes /metrics through a published loopback port, the way Prometheus does.
# A dummy PLEX_URL/token lets config parsing succeed; with Plex unreachable the
# exporter starts degraded and still serves /metrics (plex_http_reachable 0).
# Runs read-only with no tmpfs, as in docs/hardening.md's hardened profile, so the
# gate proves the image boots, binds and stays healthy without a writable folder.
# SMOKE_TIMEOUT: the HEALTHCHECK's 15s start-period plus two 30s intervals,
# rounded up.
SMOKE_APP_NAME=plex-exporter
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-p 127.0.0.1::9594 -e PLEX_URL=http://127.0.0.1:1 -e PLEX_TOKEN=smoke-token --read-only"

SMOKE_LICENSE_TREE=1

smoke_verify() {
  command -v curl >/dev/null 2>&1 || {
    printf 'FAIL: curl is required on the runner\n' >&2
    return 1
  }
  pe_addr=$(docker port "$SMOKE_CONTAINER" 9594/tcp | head -n 1)
  case "$pe_addr" in
    127.0.0.1:*) ;;
    *)
      printf 'FAIL: port 9594 is not published on loopback (docker port: "%s")\n' "$pe_addr" >&2
      return 1
      ;;
  esac

  pe_code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://$pe_addr/healthz" || true)
  [ "$pe_code" = 200 ] || {
    printf 'FAIL: /healthz = %s through the published port, want 200\n' "$pe_code" >&2
    return 1
  }

  pe_code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://$pe_addr/metrics" || true)
  [ "$pe_code" = 200 ] || {
    printf 'FAIL: /metrics = %s through the published port, want 200\n' "$pe_code" >&2
    return 1
  }
  pe_body=$(curl -s --max-time 5 "http://$pe_addr/metrics") || {
    printf 'FAIL: /metrics did not answer through the published port\n' >&2
    return 1
  }
  printf '%s\n' "$pe_body" | grep -qx 'plex_http_reachable 0' || {
    printf 'FAIL: /metrics has no "plex_http_reachable 0" line with Plex unreachable\n' >&2
    return 1
  }
  printf '%s\n' "$pe_body" | grep -qE '^plex_exporter_errors_total\{type="refresh"\} [1-9]' || {
    printf 'FAIL: /metrics counts no failed Plex refresh in plex_exporter_errors_total{type="refresh"}\n' >&2
    return 1
  }

  printf 'plex-exporter payload: scraped /metrics on %s (plex_http_reachable 0 with Plex unreachable), /healthz 200, failed Plex refresh counted\n' "$pe_addr"
}
