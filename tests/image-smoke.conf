# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the distroless
# `plex-exporter health` file-marker probe) to report "healthy" - proving the
# binary runs, binds its /metrics HTTP server, and the health probe works. A
# dummy PLEX_SERVER/token lets config parsing succeed; the exporter serves
# /metrics regardless of whether Plex is reachable (scrape errors surface as
# metrics, not a crash).
SMOKE_APP_NAME=plex-exporter
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-e PLEX_SERVER=http://127.0.0.1:1 -e PLEX_TOKEN=smoke-token"
