# plex-exporter alert rules, the PromQL half, for a Prometheus or Mimir ruler.
# The three LogQL rules live in alerts/logql.yaml. Load each file into its own
# ruler, because neither ruler parses the other's expressions.
#
# Scrape /metrics, port 9594 by default. Thresholds, "for" windows and severity
# labels are starting points. The scrape "job" label is yours to set, so the
# metric selectors leave it out. The two target rules are the exception.
# docs/monitoring.md explains each rule.
groups:
  - name: plex-exporter
    rules:
      # The floor under every other rule, which all go silent when the
      # exporter dies. Pair it with TargetAbsent and keep the job matcher
      # exact. docs/monitoring.md explains both choices.
      - alert: PlexExporterTargetDown
        expr: up{job="plex-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is not being scraped successfully"
          description: >
            No successful scrape of plex-exporter for 15m, so every Plex metric
            is stale and the other rules are blind. Check the container, its
            port and your scrape config.
      - alert: PlexExporterTargetAbsent
        expr: absent(up{job="plex-exporter"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter has no scrape target at all"
          description: >
            No up{job="plex-exporter"} series exists, so the exporter is no
            longer a configured scrape target. Every other rule is blind. Check
            service discovery and your scrape config.
      - alert: PlexAPIUnreachable
        expr: plex_http_reachable == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plex API unreachable to its exporter at {{ $labels.instance }}"
          description: >
            plex-exporter is running but its authenticated poll of the Plex API
            has returned plex_http_reachable=0 for 10m. The usual cause is a
            revoked or invalid PLEX_TOKEN. Metrics are stale until it recovers.
      - alert: PlexSessionPollFailing
        expr: >
          plex_session_poll_reachable == 0
          and plex_http_reachable == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plex session poll failing at {{ $labels.instance }}"
          description: >
            The /status/sessions poll has failed for 10m while the rest of the
            Plex API answers, so every session metric is absent or stale. If it
            fails only during playback, look for a decode error in the log.
      - alert: PlexExporterCollectionErrors
        expr: sum by (type) (rate(plex_exporter_errors_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Plex exporter erroring on '{{ $labels.type }}' collection"
          description: >
            plex-exporter has counted '{{ $labels.type }}' errors in every 15m
            window for 30m, so Plex metrics of that type are incomplete. The
            usual causes are a Plex API change after a server upgrade or an
            auth issue.
      - alert: PlexLibraryItemsCollapsed
        expr: >
          (max_over_time(plex_library_items[2h] offset 30m) - plex_library_items)
          / clamp_min(max_over_time(plex_library_items[2h] offset 30m), 1) > 0.5
          and max_over_time(plex_library_items[2h] offset 30m) > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Plex library '{{ $labels.library }}' lost >50% of its items"
          description: >
            Plex library '{{ $labels.library }}' has held less than half its
            item count of 1 to 2 hours ago for 30m. Likely a partly lost media
            mount or a bulk delete. Check the media mount and the library in
            Plex.
