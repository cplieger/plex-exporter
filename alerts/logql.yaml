# plex-exporter alert rules, the LogQL half, for a Loki ruler.
# The seven PromQL rules live in alerts/promql.yaml. Load each file into its own
# ruler, because neither ruler parses the other's expressions.
#
# Ship the container's logs to Loki. Grafana Alloy's Docker log discovery does
# this with no configuration. Thresholds, "for" windows and severity labels are
# starting points. The "container" selector is whatever your log collector
# sets. docs/monitoring.md explains each rule and its prerequisites.
groups:
  - name: plex-exporter
    rules:
      - alert: PlexExporterFatalError
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"} |= `level=ERROR` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter logged an error"
          description: >
            plex-exporter logged an ERROR. A startup error, such as an unset
            PLEX_URL or PLEX_TOKEN, a rejected token, a TLS error or a busy
            LISTEN_ADDR, ends in an exit. The log line names the cause.
      - alert: PlexExporterSessionMapFull
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"} |= `session map full` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is dropping Plex sessions from its tracker"
          description: >
            The session tracker is at its cap, so new Plex sessions publish no
            series and count(plex_plays_active) undercounts. No metric reports
            it. Check the concurrent stream count and how fast Plex mints
            session keys.
      - alert: PlexExporterRefreshIncomplete
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"}
            |= `fetch skipped, context deadline exceeded` [15m]
          )) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is running out of time on its Plex refresh"
          description: >
            Refresh cycles hit their deadline before the Plex Pass fetches ran,
            so the plex_host_* gauges and plex_transmit_bytes_total serve old
            values. plex_http_reachable still reads 1. Check the Plex server's
            own load.
