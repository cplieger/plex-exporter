# Recommended alert rules for plex-exporter. MIXED rule group: six rules are
# PromQL and three are LogQL, because the exporter carries its operational
# state in two places and a condition with no series still has a log line.
#
# The six PromQL rules read series the exporter publishes on /metrics (port
# 9594 by default): scrape that endpoint and evaluate them with Prometheus or
# the Mimir ruler. They need nothing beyond the scrape itself, because every
# series they read is registered unconditionally — no setting can silence one.
#
# The three LogQL rules (PlexExporterFatalError, PlexExporterSessionMapFull,
# PlexExporterRefreshIncomplete) read the container's log stream, because
# their condition has no series to read: either the process is already gone
# before it could publish one, or the exporter keeps serving every series
# while the data behind it is wrong. Ship the container's logs to Loki
# (Grafana Alloy's Docker log discovery does this with no configuration) and
# evaluate those three with Loki's ruler; firing alerts deliver through your
# Alertmanager exactly like the metric ones.
# Their shared prerequisites are the log ENCODING and the log DESTINATION, and
# the exporter satisfies both out of the box. It writes Go slog logfmt to
# stderr, which Docker captures, so `level=ERROR` and the `msg` text are plain
# substrings and no parser stage is needed (Go renders the level UPPERCASE, so
# match `level=ERROR` and never `level=error`). There is no log-level setting,
# so the level is fixed at INFO: every WARN and ERROR line these rules match
# is always emitted, and a DEBUG line can never be matched.
#
# Thresholds, the "for" windows, and the severity labels are starting points;
# adjust them to your deployment. The scrape "job" label is yours to set, so
# it is intentionally left out of the metric selectors; PlexExporterTargetDown
# and PlexExporterTargetAbsent are the two exceptions and say why. The
# "container" selector on the three log rules is whatever your log collector
# sets (Alloy's Docker log discovery sets "container" with no configuration;
# Promtail and others may key on "job" or "service" instead).
groups:
  - name: plex-exporter
    rules:
      # Every other rule here reads a gauge the exporter itself publishes, so
      # every other rule goes silent when the exporter dies. This one is the
      # floor under them.
      #
      # Two arms, because neither covers the other. `up == 0` catches a target
      # that is configured and failing, and keeps its labels so the alert names
      # which instance. `absent(up{...})` catches a target that stopped EXISTING
      # — a deleted Kubernetes pod or ServiceMonitor, a dropped scrape target, a
      # removed scrape config — where `up` has no series at all and `up == 0` can
      # never match.
      #
      # Use an EXACT job matcher, not a regex. A regex form
      # (absent(up{job=~".*x.*"} == 1)) looks tidier and is wrong twice: with
      # several replicas on one job it asks whether ANY of them is up, so one
      # healthy replica masks every failed one; and the synthetic result carries
      # no job label at all, so the alert reaches your Alertmanager with nothing
      # to route or group on.
      - alert: PlexExporterTargetDown
        expr: up{job="plex-exporter"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is not being scraped successfully"
          description: >
            No successful scrape of plex-exporter for 15m, so every Plex metric
            is stale and every other rule in this group is blind. Either the
            scrape is failing (container down, wrong port, network) or the
            target is gone from service discovery entirely. Check the container
            and your scrape config. Set the job matcher to whatever your scrape
            config calls this exporter.
      - alert: PlexExporterTargetAbsent
        expr: absent(up{job="plex-exporter"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter has no scrape target at all"
          description: >
            There is no up{job="plex-exporter"} series, so plex-exporter is not merely
            failing to scrape but is no longer a configured target: a dropped
            scrape target, a removed scrape config, or a deleted Kubernetes pod
            or ServiceMonitor. Every other rule in this group is blind.
      - alert: PlexAPIUnreachable
        expr: plex_http_reachable == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plex API unreachable to its exporter on {{ $labels.server }}"
          description: >
            plex-exporter is running but its authenticated poll of the Plex API
            has returned plex_http_reachable=0 for 10m - most often a
            revoked/invalid PLEX_TOKEN. Metrics are stale until resolved.
      - alert: PlexSessionPollFailing
        expr: >
          plex_session_poll_reachable == 0
          and plex_http_reachable == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plex session poll failing on {{ $labels.server }}"
          description: >
            plex-exporter's /status/sessions poll has returned
            plex_session_poll_reachable=0 for 10m while the rest of the Plex
            API still answers (plex_http_reachable=1). Every session metric
            (plex_plays_active, plex_play_seconds_total, the bandwidth and
            bitrate gauges) is absent or stale until it recovers. A poll that
            fails only while something is playing points at the session
            payload itself, so read the exporter log for a decode error.
      - alert: PlexExporterCollectionErrors
        expr: sum by (type) (rate(plex_exporter_errors_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Plex exporter erroring on '{{ $labels.type }}' collection"
          description: >
            plex-exporter has logged '{{ $labels.type }}' errors continuously
            for 30m (rate>0 over 15m). Plex metrics of that category are
            degraded/incomplete; typically a Plex API change after a server
            upgrade, or an auth issue.
      - alert: PlexLibraryItemsCollapsed
        expr: >
          (max_over_time(plex_library_items[2h] offset 30m) - plex_library_items)
          / clamp_min(max_over_time(plex_library_items[2h] offset 30m), 1) > 0.5
          and max_over_time(plex_library_items[2h] offset 30m) > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Plex library '{{ $labels.library }}' lost >50% of its items"
          description: >
            Item count for Plex library '{{ $labels.library }}' has fallen by
            more than 50% versus its level ~1-2h ago and stayed down for 30m.
            Likely a partly lost media mount or an accidental bulk delete.
            Check the media bind mount and the library on the Plex server.
            A collapse all the way to zero is covered too: the exporter
            publishes plex_library_items=0 once it reads a library as empty, so
            the drop is a full 100% and this expression sees it. A library whose
            count cannot be READ is a different condition and deliberately does
            not fire here — the series holds its last value and the fetch
            failure raises plex_exporter_errors_total{type="library_items"},
            which PlexExporterCollectionErrors alerts on.

      # --- LogQL rules, evaluated by LOKI's ruler, not by Prometheus --------
      # Everything below is LogQL over the container's log stream. Each of the
      # three conditions has no series to read; see the header comment.
      - alert: PlexExporterFatalError
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"} |= `level=ERROR` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter logged an error"
          description: >
            No series can carry this one: every configuration and startup
            error the exporter reports is followed by a non-zero exit, so the
            process is gone before /metrics could publish anything, and a
            restart policy then repeats the line on every attempt. The causes
            are an unset PLEX_URL or PLEX_TOKEN, a rejected token or another
            4xx, a 404 (reached Plex, wrong server), a TLS or CA
            misconfiguration, a LISTEN_ADDR already in use, and a
            metrics-server failure after startup. The other producer of an
            ERROR line is the HTTP middleware, which does NOT exit: a
            recovered panic, or a 5xx on /metrics or /api/health. Read the
            line, it names which. PlexExporterTargetDown reaches the same
            outage 15m later, without the cause.
      - alert: PlexExporterSessionMapFull
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"} |= `session map full` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is dropping Plex sessions from its tracker"
          description: >
            The session tracker is at its cap, so a new playback session was
            not tracked and publishes no series at all. Nothing in /metrics
            reports this: the dropped session is simply missing, every other
            series stays healthy, no error counter moves, and
            count(plex_plays_active) understates the real stream count. Expect
            either a genuinely large concurrent-stream count or a Plex server
            minting session keys faster than the tracker reclaims them (a
            stopped session is reclaimed after 60s, an idle one after 5m). The
            line carries the tracked and cap attributes.
      - alert: PlexExporterRefreshIncomplete
        expr: |
          sum by (container) (count_over_time(
            {container="plex-exporter"}
            |= `fetch skipped, context deadline exceeded` [15m]
          )) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "plex-exporter is running out of time on its Plex refresh"
          description: >
            A refresh cycle reached its deadline before the host-resources or
            bandwidth fetch ran, so those Plex Pass gauges
            (plex_host_cpu_utilization_ratio,
            plex_host_memory_utilization_ratio, plex_transmit_bytes_total) go
            on serving the values from an earlier cycle rather than going
            absent. No series reports it: this path records no error and does
            not touch plex_http_reachable, which still reads 1 because the
            fetches earlier in the same cycle succeeded. The threshold of 3
            excludes a single slow cycle; more than that means Plex has been
            answering slowly for minutes. Check the Plex server's own load.
